
name: Step 2 – Markdown challenge

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  step_2:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read current step
        id: step
        run: |
          STEP=$(cat .github/steps/-step.txt)
          echo "step=$STEP" >> $GITHUB_OUTPUT

      - name: Validate Markdown comment
        if: ${{ steps.step.outputs.step == '1' }}
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          MISSING=""

          # Check for blockquote
          if ! [[ "$COMMENT" =~ ^\> ]]; then
            MISSING="$MISSING Blockquote (> )"
          fi

          # Check for inline code
          if ! [[ "$COMMENT" =~ \`[^`]+\` ]]; then
            MISSING="$MISSING, Inline code (`)"
          fi

          # Check for emphasis
          if ! [[ "$COMMENT" =~ _{2,3}[^_]+_{2,3} ]]; then
            MISSING="$MISSING, Emphasis (__, ___)"
          fi

          if [ -n "$MISSING" ]; then
            gh issue comment "${{ github.event.issue.number }}" \
              --body "❌ Your Markdown is missing: $MISSING"
            exit 0
          fi

          # Success → add Step 2 instructions as a comment
          gh issue comment "${{ github.event.issue.number }}" \
            --body "✅ Step 1 complete! Here’s Step 2:\n\n$(cat .github/steps/step-2.md)"

          # Update step counter
          echo "2" > .github/steps/-step.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "Advance to Step 2"
          git push

