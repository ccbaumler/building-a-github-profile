name: Step 1 – Markdown challenge

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  step_1:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get comment
        id: comment
        run: |
          echo "comment<<EOF" >> $GITHUB_ENV
          echo "${{ github.event.comment.body }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Validate Markdown
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          MISSING=""
          
          # check for blockquote
          if ! [[ "$COMMENT" =~ ^\> ]]; then
            MISSING="$MISSING Blockquote (> )"
          fi

          # check for inline code
          if ! [[ "$COMMENT" =~ \`[^`]+\` ]]; then
            MISSING="$MISSING, Inline code (`)`"
          fi

          # check for emphasis
          if ! [[ "$COMMENT" =~ _{2,3}[^_]+_{2,3} ]]; then
            MISSING="$MISSING, Emphasis (__, ___)"
          fi

          if [ -n "$MISSING" ]; then
            gh issue comment "${{ github.event.issue.number }}" \
              --body "❌ Your Markdown is missing: $MISSING"
            exit 0
          fi

          # Success
          gh issue comment "${{ github.event.issue.number }}" \
            --body "✅ Nice work! Your Markdown looks correct. Advancing to Step 2."

          # Update step counter
          echo "2" > .github/steps/-step.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "Advance to step 2"
          git push

