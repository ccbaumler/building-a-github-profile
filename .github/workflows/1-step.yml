
name: Step 1 – Unlock Markdown challenge

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  get_current_step:
    name: Check current step number
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: get_step
        run: |
          echo "current_step=$(cat ./.github/steps/-step.txt)" >> $GITHUB_OUTPUT
    outputs:
      current_step: ${{ steps.get_step.outputs.current_step }}

  advance_to_step_1:
    name: Advance to step 1
    needs: get_current_step

    if: >-
      ${{ !github.event.repository.is_template
          && needs.get_current_step.outputs.current_step == 1 }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unlock markdown challenge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT: ${{ github.event.comment.body }}

        run: |
          COMMENT_LOWER=$(echo "$COMMENT" | tr '[:upper:]' '[:lower:]')
          if [[ "$COMMENT_LOWER" == "ready" ]]; then
            echo "✅ Learner is ready — advancing to Step 1"
            
            # Update issue body to Step 1 Markdown
            gh issue edit "${{ github.event.issue.number }}" \
              --body-file ".github/steps/step-1.md"
            
            # Update step counter
            echo "1" > .github/steps/-step.txt
            git config user.name github-actions
            git config user.email github-actions@github.com
            git commit -am "Advance to Step 1"
            git push
          else
            echo "❌ Comment does not match 'ready', ignoring"

      - name: Update to step 1
        uses: skills/action-update-step@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          from_step: 1
          to_step: 2
          branch_name: main
