
name: Step 1 – Unlock Markdown challenge

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  step_1:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read current step
        id: step
        run: |
          STEP=$(cat .github/steps/-step.txt)
          echo "step=$STEP" >> $GITHUB_OUTPUT

      - name: Check for 'ready' comment
        if: ${{ steps.step.outputs.step == '0' }}
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          COMMENT_LOWER=$(echo "$COMMENT" | tr '[:upper:]' '[:lower:]')
          if [[ "$COMMENT_LOWER" == "ready" ]]; then
            echo "✅ Learner is ready — advancing to Step 1"
            
            # Update issue body to Step 1 Markdown
            gh issue edit "${{ github.event.issue.number }}" \
              --body-file ".github/steps/step-1.md"
            
            # Update step counter
            echo "1" > .github/steps/-step.txt
            git config user.name github-actions
            git config user.email github-actions@github.com
            git commit -am "Advance to Step 1"
            git push
          else
            echo "❌ Comment does not match 'ready', ignoring"

