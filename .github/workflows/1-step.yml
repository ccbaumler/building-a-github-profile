name: Step 1 – Unlock Markdown challenge

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  get_current_step:
    name: Check current step number
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: get_step
        run: |
          echo "current_step=$(cat ./.github/steps/-step.txt)" >> $GITHUB_OUTPUT
    outputs:
      current_step: ${{ steps.get_step.outputs.current_step }}

  advance_to_step_1:
    name: Advance to step 1
    needs: get_current_step

    if: >-
      ${{ !github.event.repository.is_template
          && needs.get_current_step.outputs.current_step == 1 }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unlock markdown challenge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT: ${{ github.event.comment.body }}

        run: |
          MISSING=""

          # Check for blockquote
          if ! [[ "$COMMENT" =~ ^\> ]]; then
            MISSING="$MISSING Blockquote (> )"
          fi

          # Check for inline code
          if ! [[ "$COMMENT" =~ \`[^`]+\` ]]; then
            MISSING="$MISSING, Inline code (`)"
          fi

          # Check for emphasis
          if ! [[ "$COMMENT" =~ _{2,3}[^_]+_{2,3} || "$COMMENT" =~ \*{2,3}[^_]+\*{2,3} ]]; then
            MISSING="$MISSING, Emphasis (__, ___) or (**, ***)"
          fi

          if [ -n "$MISSING" ]; then
            gh issue comment "${{ github.event.issue.number }}" \
              --body "❌ Your Markdown is missing: $MISSING"
            exit 0
          fi

          gh issue edit "${{ github.event.issue.number }}" \
            --body-file "✅ Learner is ready — advancing to Step 2"

          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Update to step 2
        uses: ./.github/actions/action-update-step-in-issue
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          from_step: 1
          to_step: 2
          issue_number: ${{ github.event.issue.number }}
